name: Native exact-pin CPU wheels
on:
  push:
    branches: [ci/native-exact-pins-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.6.1'
            sha: 'de13727218c8e5855e6299ec2734f7c7b801d4a4'
            mode: build
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MagicStack/httptools
          ref: ${{ matrix.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build and exercise installed wheel
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONNOUSERSITE: '1'
        run: python harness/.native-ci/lane.py httptools '${{ matrix.version }}' '${{ matrix.sha }}' '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: httptools-${{ matrix.version }}-cp312-win-arm64
          path: ${{ github.workspace }}/native/artifacts
          if-no-files-found: error
          retention-days: 14
